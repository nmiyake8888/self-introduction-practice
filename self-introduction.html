<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>自己紹介-三宅希望</title>
    </head>
    <body>
        <h1>自己紹介</h1>
        <h2>プロフィール</h2>
        <p>名前　：三宅希望</p>
        <p>年齢　：29歳</p>
        <p>出身地：長野県</p>
        <p>趣味　：編み物、読書、旅行</p>

        <h2>好きな物</h2>
        <ul>
            <li>コーヒー</li>
            <li>辛いもの</li>
            <li>肉</li>
        </ul>

        <h2>今年の目標</h2>
        <ol>
            <li>睡眠時間を削らないで学習する</li>
            <li>週30時間の学習継続</li>
            <li>PHP入門を終わらせる</li>
        </ol>

        <h2>リンク</h2>
        <a href="https://github.com/nmiyake8888" target="_blank">GitHub</a
        ><br />
        <a href="https://x.com/nmiyake_8888" target="_blank">X(旧Twitter)</a>

        <h2>好きな風景</h2>
        <img src="./img/landscape.jpg" alt="好きな風景" width="400px" />

        <h2>お問い合わせ</h2>
        <form action="submit" method="post">
            <div>
                <label for="name">お名前：</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="山田 太郎"
                    required
                />
            </div>
            <div>
                <label for="contact-type">お問い合わせ内容：</label>
                <select name="category" id="contact-type">
                    <option value="">-- 選択してください --</option>
                    <option value="normal-contact">一般的なお問い合わせ</option>
                    <option value="comments-and-requests">
                        ご意見・ご要望
                    </option>
                </select>
            </div>
            <div>
                <label for="message">お問い合わせ内容：</label>
                <textarea
                    name="contact-message"
                    id="message"
                    rows="5"
                    cols="20"
                    placeholder="お問い合わせ内容をご記入ください"
                    required
                ></textarea>
            </div>
            <div>
                <button type="submit">送信する</button>
            </div>
        </form>
    </body>
</html>
